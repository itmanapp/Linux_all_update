name: shellcheck

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check (all scripts)
        run: |
          fail=0
          for f in *.sh; do
            echo "== bash -n $f"
            bash -n "$f" || fail=1
          done
          exit $fail

      # 規則：README.md 的建議流程必須指向最新的版本檔名。
      # 這是人工很容易忘記的一步（v3.0 就漏過一次），用 CI 擋下來。
      - name: README points at the newest version
        run: |
          latest=$(ls ubuntu_all_update_v*.sh \
                   | sed -E 's/^ubuntu_all_update_(v[0-9]+\.[0-9]+)\.sh$/\1/' \
                   | sort -V | tail -1)
          echo "偵測到最新版本：$latest"
          if ! grep -q "ubuntu_all_update_${latest}\.sh" README.md; then
            echo "::error::README.md 的建議流程沒有指向最新版本 ubuntu_all_update_${latest}.sh"
            exit 1
          fi

      - name: shellcheck (v3.0 - strict)
        run: shellcheck -S warning ubuntu_all_update_v3.0.sh suse_all_update_v3.0.sh

      # v1 與 v2.1 保留原狀，僅供參考；suse_all_update.sh 有一個已知的
      # SC2043（單元素 for 迴圈，無害），所以不讓它們擋 CI。
      - name: shellcheck (v1 + v2.1 - informational only)
        continue-on-error: true
        run: shellcheck -S warning ubuntu_all_update.sh suse_all_update.sh ubuntu_all_update_v2.1.sh suse_all_update_v2.1.sh
